name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-lint:
    name: Backend Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        working-directory: ./backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff linter
        working-directory: ./backend
        run: ruff check .

      - name: Check Black formatting
        working-directory: ./backend
        run: black --check .

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        working-directory: ./backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        working-directory: ./backend
        run: pytest -v

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install dependencies
        working-directory: ./frontend
        run: |
          npm ci
          npm install --no-save @rollup/rollup-linux-x64-gnu

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

  frontend-unit-tests:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install dependencies
        working-directory: ./frontend
        run: |
          npm ci
          npm install --no-save @rollup/rollup-linux-x64-gnu

      - name: Run unit tests
        working-directory: ./frontend
        run: npm test -- --run

  integration-tests:
    name: Integration Tests (Docker Stack)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: car_user
          POSTGRES_PASSWORD: car_password
          POSTGRES_DB: car_budget_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run database migrations
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+psycopg2://car_user:car_password@localhost:5432/car_budget_test
          SECRET_KEY: test-secret-key-for-ci
          DEBUG: "false"
        run: alembic upgrade head

      - name: Run API integration tests
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+psycopg2://car_user:car_password@localhost:5432/car_budget_test
          SECRET_KEY: test-secret-key-for-ci
          DEBUG: "false"
          ALLOWED_ORIGINS: "http://localhost:5173"
        run: pytest -v --tb=short

  e2e-tests:
    name: E2E Tests (Cypress)
    runs-on: ubuntu-latest
    needs: [frontend-build]  # Only run if build passes

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: car_user
          POSTGRES_PASSWORD: car_password
          POSTGRES_DB: car_budget_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run database migrations
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+psycopg2://car_user:car_password@localhost:5432/car_budget_e2e
          SECRET_KEY: e2e-test-secret-key
          DEBUG: "false"
        run: alembic upgrade head

      - name: Seed database
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+psycopg2://car_user:car_password@localhost:5432/car_budget_e2e
          SECRET_KEY: e2e-test-secret-key
          DEBUG: "false"
        run: python -m app.seed || echo "Seed may have already run"

      - name: Start backend server
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+psycopg2://car_user:car_password@localhost:5432/car_budget_e2e
          SECRET_KEY: e2e-test-secret-key
          DEBUG: "false"
          ALLOWED_ORIGINS: "http://localhost:5173"
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          sleep 5
          curl --retry 10 --retry-delay 2 --retry-connrefused http://localhost:8000/health

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: |
          npm ci
          npm install --no-save @rollup/rollup-linux-x64-gnu

      - name: Run Cypress tests
        uses: cypress-io/github-action@v6
        with:
          working-directory: ./frontend
          start: npm run dev
          wait-on: 'http://localhost:5173'
          wait-on-timeout: 120
          browser: chrome
          config: baseUrl=http://localhost:5173
        env:
          CYPRESS_apiUrl: http://localhost:8000

      - name: Upload Cypress screenshots on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: frontend/cypress/screenshots
          retention-days: 7

      - name: Upload Cypress videos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-videos
          path: frontend/cypress/videos
          retention-days: 7

  all-checks-complete:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-test, frontend-build, frontend-unit-tests, integration-tests, e2e-tests]
    if: always()

    steps:
      - name: Check all jobs status
        run: |
          echo "Backend Lint: ${{ needs.backend-lint.result }}"
          echo "Backend Test: ${{ needs.backend-test.result }}"
          echo "Frontend Build: ${{ needs.frontend-build.result }}"
          echo "Frontend Unit Tests: ${{ needs.frontend-unit-tests.result }}"
          echo "Integration Tests: ${{ needs.integration-tests.result }}"
          echo "E2E Tests: ${{ needs.e2e-tests.result }}"

          if [ "${{ needs.backend-lint.result }}" != "success" ] || \
             [ "${{ needs.backend-test.result }}" != "success" ] || \
             [ "${{ needs.frontend-build.result }}" != "success" ] || \
             [ "${{ needs.frontend-unit-tests.result }}" != "success" ] || \
             [ "${{ needs.integration-tests.result }}" != "success" ] || \
             [ "${{ needs.e2e-tests.result }}" != "success" ]; then
            echo "❌ One or more checks failed!"
            exit 1
          fi
          echo "✅ All checks passed!"
